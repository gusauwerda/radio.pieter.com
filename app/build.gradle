plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pieter.radio'
    compileSdk 34
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'com.pieter.radio'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
